# The dashboard → Cloudflare Pages.
#
# Tests and typecheck run first and the deploy depends on them. That ordering
# is the point of having this in CI at all: the alternative is Cloudflare's own
# Git integration, which builds whatever is on main whether or not it works.
#
# Secrets this needs, set under Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN    a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   from the right-hand side of any Cloudflare dashboard page
#
# The Pages project must exist first — see "Deploying" in payhold-dashboard/CLAUDE.md.

name: Deploy dashboard

on:
  push:
    branches: [main]
    # Only when the dashboard actually changed. A backend-only commit has no
    # business republishing the front end.
    paths:
      - 'payhold-dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

defaults:
  run:
    working-directory: payhold-dashboard

# One deploy at a time. Two overlapping runs would race to publish, and the
# slower one wins — which is the older one.
concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: payhold-dashboard/package-lock.json

      # `ci` not `install`: it installs exactly the lockfile and fails if
      # package.json and the lock disagree, which is what you want deciding
      # whether to publish.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Vite inlines `VITE_*` at build time, and the build happens *here* —
      # wrangler below only uploads the finished `dist`. So this is the only
      # place pointing the dashboard at a backend can be done; the same names
      # set in Cloudflare's own project settings would never be read, because
      # Cloudflare is serving static files it did not build.
      #
      # Repository **variables**, not secrets. Both end up in the shipped
      # bundle, and calling something a secret that anyone can read out of the
      # JavaScript teaches the wrong lesson about which of these is dangerous.
      # The anon key grants nothing on its own — RLS is what stands behind it.
      # The service-role key has no `VITE_` name it could hide behind and must
      # never appear in this file.
      #
      # **Both are required and the build fails without them.** There used to be
      # three more flags here choosing how much of the dashboard ran against the
      # real backend and how much against an in-browser mock; the mock is gone,
      # so an unset URL is a misconfiguration rather than a demo build, and it
      # is better caught here than shipped as a dashboard full of numbers
      # nobody can trace.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # Skipped, not failed, until the secrets exist. This workflow lands on
      # main before the Cloudflare project does, and a red X on a commit that
      # is fine teaches people to ignore red Xs.
      - name: Check Cloudflare is configured
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — built and tested, not published."
          fi

      - name: Publish to Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: payhold-dashboard
          command: pages deploy dist --project-name=payhold --branch=main
