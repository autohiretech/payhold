# The backend → Supabase. Not Cloudflare.
#
# The money engine is SQL — `release_deal`, `fund_deal` and the ledger run
# inside Postgres transactions with row locks, and RLS is what stops one
# tenant reading another's rows. None of that has an equivalent on Workers, so
# the backend deploys where its database is.
#
# Secrets this needs:
#   SUPABASE_ACCESS_TOKEN   a personal access token, from the Supabase dashboard
#   SUPABASE_PROJECT_REF    mwnbjjlilqrwdmwutbxr
#   SUPABASE_DB_PASSWORD    used to apply migrations, and to check none are
#                           pending before functions deploy
#
# The function secrets themselves — CREDENTIALS_KEY, CRON_SECRET,
# DASHBOARD_ORIGIN, PUBLIC_URL — are set once with `supabase secrets set` and
# are deliberately NOT in this file or in GitHub. CREDENTIALS_KEY decrypts every
# tenant's provider credentials; it does not belong in a CI log.
#
# **Run by hand only, and database first (2026-09-11).** This used to start on
# every push to main, and its functions job ran in parallel with — not after —
# migrations, which only ever ran when dispatched. So a push carrying a schema
# change deployed Edge Functions that read columns the live database did not
# have yet: twice that day a push started this workflow for exactly such a
# commit (one-destination-per-seller selects `seller_destinations.archived_at`,
# which would have made every seller's destination list come back empty) and
# the runs had to be cancelled by hand. It only failed harmlessly because
# SUPABASE_ACCESS_TOKEN was never set; setting it would have armed it.
#
# Now: nothing runs on push. A person dispatches it, having read the diff.
# `test` gates everything; `migrate` (when ticked) runs next; `functions` runs
# only after `migrate` succeeded or was not requested, and then refuses to
# deploy if the live database still has pending migrations — so functions can
# never land ahead of the schema they need, ticked or not.
#
# The dashboard is not deployed here (Cloudflare Pages, by hand, after this).

name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: 'Apply pending migrations to the live database first'
        type: boolean
        default: false

defaults:
  run:
    working-directory: payhold-backend

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # The gate. Every invariant the money engine claims, checked against a real
  # Postgres before anything is deployed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: payhold-backend/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci

      - name: Typecheck the Edge Functions
        run: npm run typecheck

      - name: Schema and money invariants (PGlite)
        run: npm run test:sql

      - name: Edge Function tests
        run: npm run test:functions

  # `db push` is forward-only and runs against the live database — the one
  # holding real money. It runs only when a person ticks `migrate`, and always
  # BEFORE functions deploy.
  migrate:
    needs: test
    if: inputs.migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show what would be applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase migration list

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

  functions:
    needs: [test, migrate]
    # After `migrate` succeeded, or when it was not requested (skipped) —
    # never alongside it, never after it failed, never if tests failed.
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # **Fails, not skips.** This step used to write `ready=false` and emit a
      # notice, and the deploy below was conditional on it — so with the secret
      # unset the job did every test, deployed nothing, and reported success.
      # On 2026-09-10 three consecutive green runs shipped nothing at all while
      # a whole day's backend work sat undeployed and was reported as live off
      # those green ticks; what caught it was a client noticing a field that
      # should have been there was missing.
      #
      # That is precisely the failure `payhold-dashboard/CLAUDE.md` records for
      # the old dashboard workflow — "built, tested and then skipped the publish
      # because CLOUDFLARE_API_TOKEN was never set, so the tested pipeline was
      # not the one shipping" — and it was serious enough there to delete the
      # workflow over. A pipeline that is silent about not shipping is worse
      # than one that does not exist, because a green tick is read as a deploy.
      #
      # So a missing token is now a red run that names the secret and the fix.
      - name: Check Supabase is configured
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set, so the Edge Functions were NOT deployed."
            echo "::error::Set it at Settings -> Secrets -> Actions, or deploy by hand with 'supabase functions deploy ... --project-ref <ref>'."
            exit 1
          fi
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is not set, so pending migrations cannot be checked and the Edge Functions were NOT deployed."
            exit 1
          fi

      # The guard that makes the order hold even when nobody ticked `migrate`:
      # code that needs a column must not go live before the column does.
      - name: Refuse to deploy ahead of the database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          pending=$(supabase migration list -o json | jq -r '.migrations[] | select((.remote // "") == "") | .local')
          if [ -n "$pending" ]; then
            echo "::error::These migrations are not applied to the live database yet, so the Edge Functions were NOT deployed:"
            echo "$pending"
            echo "::error::Re-run this workflow with 'migrate' ticked (having read the migration), or apply them by hand first."
            exit 1
          fi

      # Deployed together so a shared change in `_shared/` cannot land in one
      # function and not another.
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy \
            account deals checkout payment-options sellers balance payouts risk-signals \
            ledger audit-log payout-routes settings api-keys admin \
            disputes launch webhook-endpoints flutterwave-webhook stripe-webhook paypal-webhook \
            provider-accounts \
            webhook-dispatch reconcile auto-release payout-dispatch settle-pending \
            ai-dispute ai-risk-narrator ai-support ai-decisions \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
